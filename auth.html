<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create an account or sign in to Navaneeth Krishnan's portfolio." />
  <title>Account — Navaneeth Krishnan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-page { min-height:100vh; display:grid; place-items:center; padding:110px 20px 50px; }
    .auth-card { width:min(100%,470px); padding:clamp(25px,5vw,42px); border:1px solid var(--glass-border); border-radius:var(--radius-lg); background:var(--glass-bg-strong); box-shadow:var(--shadow-card); backdrop-filter:blur(18px); }
    .auth-brand { display:inline-block; font-family:var(--font-display); font-size:1.35rem; font-weight:800; margin-bottom:26px; }
    .auth-brand span { color:var(--accent-purple); }
    .auth-card h1 { font-family:var(--font-display); font-size:2rem; margin-bottom:8px; }
    .auth-subtitle { color:var(--text-2); margin-bottom:26px; }
    .auth-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:5px; background:var(--bg-3); border-radius:12px; margin-bottom:24px; }
    .auth-tab { padding:11px; border:0; border-radius:9px; color:var(--text-2); background:transparent; cursor:pointer; font:inherit; font-weight:600; }
    .auth-tab.active { background:var(--glass-bg-strong); color:var(--text-1); box-shadow:var(--shadow-card); }
    .auth-field { margin-bottom:17px; }
    .auth-field label { display:block; margin-bottom:7px; font-size:.88rem; font-weight:600; }
    .auth-field input { width:100%; padding:13px 15px; border:1px solid var(--glass-border); border-radius:12px; color:var(--text-1); background:var(--bg-2); outline:none; font:inherit; }
    .auth-field input:focus { border-color:var(--accent-purple); }
    .auth-meta { display:flex; justify-content:flex-end; margin:-5px 0 18px; }
    .auth-text-link { color:var(--accent-cyan); cursor:pointer; background:none; border:0; font:inherit; font-size:.86rem; }
    .auth-divider { display:flex; align-items:center; gap:12px; color:var(--text-3); font-size:.8rem; margin:20px 0; }
    .auth-divider:before,.auth-divider:after { content:""; height:1px; background:var(--glass-border); flex:1; }
    .google-btn { width:100%; justify-content:center; }
    .auth-status { min-height:22px; margin-top:15px; font-size:.88rem; color:var(--text-2); }
    .auth-back { display:block; text-align:center; margin-top:24px; color:var(--text-2); font-size:.9rem; }
    .auth-back:hover { color:var(--accent-cyan); }
    .auth-terms { color:var(--text-3); font-size:.77rem; line-height:1.5; margin-top:18px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <header class="navbar scrolled">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-bracket">&lt;</span>NK<span class="logo-bracket">/&gt;</span></a>
      <div class="nav-actions"><a href="index.html" class="btn btn-ghost">Back to portfolio</a></div>
    </div>
  </header>
  <main class="auth-page">
    <section class="auth-card">
      <a href="index.html" class="auth-brand"><span>&lt;</span>NK<span>/&gt;</span></a>
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-subtitle" id="authSubtitle">Sign in to your visitor account.</p>

      <div class="auth-tabs" role="tablist" aria-label="Account action">
        <button class="auth-tab active" id="loginTab" type="button">Sign in</button>
        <button class="auth-tab" id="signupTab" type="button">Create account</button>
      </div>

      <form id="authForm">
        <div class="auth-field" id="nameField" hidden>
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Your name" />
        </div>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters" />
        </div>
        <div class="auth-meta" id="forgotWrap">
          <button class="auth-text-link" id="forgotPassword" type="button">Forgot password?</button>
        </div>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>
      <button class="btn btn-ghost google-btn" id="googleBtn" type="button">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
      <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
      <p class="auth-terms">By creating an account, you agree to use this portfolio account responsibly. Your account is used for visitor-facing features; it does not grant administrative access.</p>
      <a class="auth-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to portfolio</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
